name: CI/CD Pipeline

on:
    push:
        branches: [ main ]
        paths-ignore:
            - 'kubernetes/deployment.yaml'
    pull_request:
        branches: [ main ]

jobs:
    test:
        name: Unit testing
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test || echo "No tests found, would add tests in a real project"
              


